name: Sync showcase

# Fully-automatic project showcase: any public repo tagged with the
# `showcase` topic gets a card in the site's work section.
# Runs daily 06:30 PT + on demand. Commits showcase.json, then explicitly
# dispatches the main CI (a GITHUB_TOKEN push does not trigger workflows
# by itself, so the deploy is kicked off via the dispatch API).
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync showcase.json from GitHub topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-showcase.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add showcase.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ci: sync showcase from GitHub topics" && git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/yexiangd/shipwright-studio"
              "/actions/workflows/ci.yml/dispatches",
              data=json.dumps({"ref": "main"}).encode(), method="POST",
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "User-Agent": "shipwright-showcase-sync"})
          urllib.request.urlopen(req, timeout=30)
          print("deploy dispatched")
          EOF
